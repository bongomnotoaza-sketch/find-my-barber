<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Reset Password | Find My Barber</title>

  <meta
    name="description"
    content="Reset your Find My Barber account password."
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #09090b;
      color: #fafafa;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.7px;
    }

    .subtitle {
      margin: 0 0 30px;
      color: #a1a1aa;
      font-size: 14px;
      line-height: 1.6;
    }

    .accent {
      width: 45px;
      height: 4px;
      margin-bottom: 25px;
      border-radius: 10px;
      background: linear-gradient(
        90deg,
        #f97316,
        #ef4444,
        #ec4899
      );
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: 600;
      color: #e4e4e7;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #3f3f46;
      border-radius: 9px;
      outline: none;
      background: #18181b;
      color: #fafafa;
      font-size: 15px;
    }

    input:focus {
      border-color: #f97316;
    }

    input::placeholder {
      color: #71717a;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 5px;
      border: none;
      border-radius: 9px;
      background: linear-gradient(
        90deg,
        #f97316,
        #ef4444,
        #ec4899
      );
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 20px;
      padding: 13px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #message.success {
      display: block;
      background: #052e16;
      color: #bbf7d0;
      border: 1px solid #166534;
    }

    #message.error {
      display: block;
      background: #450a0a;
      color: #fecaca;
      border: 1px solid #991b1b;
    }

    #message.info {
      display: block;
      background: #18181b;
      color: #d4d4d8;
      border: 1px solid #3f3f46;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      font-size: 13px;
      color: #71717a;
    }

    .footer a,
    .success-link {
      color: #fb923c;
      text-decoration: none;
    }

    .footer a:hover,
    .success-link:hover {
      text-decoration: underline;
    }

    #reset-form {
      display: none;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="accent"></div>

    <h1>Reset your password</h1>

    <p class="subtitle">
      Create a new password for your Find My Barber account.
      Choose a password you haven't used before.
    </p>

    <form id="reset-form">

      <div class="field">
        <label for="password">New password</label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your new password"
          minlength="6"
          autocomplete="new-password"
          required
        />
      </div>

      <div class="field">
        <label for="confirm-password">Confirm new password</label>

        <input
          type="password"
          id="confirm-password"
          name="confirm-password"
          placeholder="Enter your password again"
          minlength="6"
          autocomplete="new-password"
          required
        />
      </div>

      <button type="submit" id="submit-button">
        Update password
      </button>

    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="footer">
      <a href="/">Return to Find My Barber</a>
    </div>

  </main>

  <!-- Supabase JavaScript client -->
  <script type="module">

    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // --------------------------------------------------
    // 1. SUPABASE CONFIGURATION
    // --------------------------------------------------

    const SUPABASE_URL =
     "https://vypmrrvjyymgjnkebpka.supabase.co";

    const SUPABASE_ANON_KEY =
     "sb_publishable_OGf7W2cdt2EujSRy-6BGTA_rvoETmNK";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    // --------------------------------------------------
    // 2. PAGE ELEMENTS
    // --------------------------------------------------

    const form = document.getElementById("reset-form");

    const passwordInput = document.getElementById("password");

    const confirmPasswordInput =
      document.getElementById("confirm-password");

    const submitButton =
      document.getElementById("submit-button");

    const messageBox = document.getElementById("message");

    let recoveryReady = false;

    let passwordUpdated = false;

    // --------------------------------------------------
    // 3. MESSAGE HANDLER
    // --------------------------------------------------

    function showMessage(message, type = "info") {
      messageBox.className = type;
      messageBox.textContent = message;
    }

    // --------------------------------------------------
    // 4. VERIFY THE RECOVERY SESSION
    // --------------------------------------------------

    async function initialiseResetPage() {

      showMessage("Verifying your password reset link...");

      try {

        const { data, error } = await supabase.auth.getSession();

        if (error) {
          throw error;
        }

        if (!data.session) {

          showMessage(
            "This password reset link is invalid, expired, or has already been used. Please request a new password reset email.",
            "error"
          );

          return;
        }

        recoveryReady = true;

        form.style.display = "block";

        showMessage(
          "Your reset link is valid. Enter your new password below.",
          "info"
        );

        // Remove recovery tokens from the visible URL after
        // Supabase has processed the URL and restored the session.
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

      } catch (error) {

        console.error("Password recovery initialisation failed:", error);

        showMessage(
          "We couldn't verify your reset link. Please request a new password reset email.",
          "error"
        );

      }
    }

    // --------------------------------------------------
    // 5. UPDATE THE PASSWORD
    // --------------------------------------------------

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      if (!recoveryReady || passwordUpdated) {
        return;
      }

      const password = passwordInput.value;

      const confirmPassword = confirmPasswordInput.value;

      // Check that both passwords match.
      if (password !== confirmPassword) {

        showMessage(
          "Your passwords do not match. Please try again.",
          "error"
        );

        confirmPasswordInput.focus();

        return;
      }

      if (password.length < 6) {

        showMessage(
          "Your password must contain at least 6 characters.",
          "error"
        );

        passwordInput.focus();

        return;
      }

      submitButton.disabled = true;

      submitButton.textContent = "Updating password...";

      showMessage("Updating your password securely...");

      try {

        // Supabase updates the password for the authenticated
        // user associated with the recovery session.
        const { data, error } = await supabase.auth.updateUser({
          password: password
        });

        if (error) {
          throw error;
        }

        passwordUpdated = true;

        form.reset();

        form.style.display = "none";

        showMessage(
          "Your password has been updated successfully. You can now return to Find My Barber and sign in using your new password.",
          "success"
        );

        // Prevent this recovery session from remaining active
        // after the password reset has completed.
        const { error: signOutError } =
          await supabase.auth.signOut();

        if (signOutError) {
          console.error(
            "Could not end the recovery session:",
            signOutError
          );
        }

        // Add a link to return to the main app.
        const loginLink = document.createElement("p");

        loginLink.style.marginTop = "15px";

        const anchor = document.createElement("a");

        anchor.href = "/";

        anchor.className = "success-link";

        anchor.textContent = "Return to Find My Barber";

        loginLink.appendChild(anchor);

        messageBox.appendChild(loginLink);

      } catch (error) {

        console.error("Password update failed:", error);

        showMessage(
          error.message ||
          "We couldn't update your password. Please try again or request a new reset link.",
          "error"
        );

      } finally {

        submitButton.disabled = false;

        submitButton.textContent = "Update password";

      }

    });

    // --------------------------------------------------
    // 6. START THE RESET PROCESS
    // --------------------------------------------------

    await initialiseResetPage();

  </script>

</body>
</html>
